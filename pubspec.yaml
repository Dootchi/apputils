name: apputils
description: Reusable native capabilities for Dootchi Flutter applications.
version: 0.1.0
homepage: https://github.com/Dootchi/apputils
repository: https://github.com/Dootchi/apputils
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.dootchi.apputils
        pluginClass: ApputilsPlugin
      ios:
        pluginClass: ApputilsPlugin
